
# AlphaChatGuard 1.0.0
# AlphaGrief

settings:

  # Блокировка ссылок
  links:
    enabled: true

    # Telegram
    telegram: true

    # Discord
    discord: true

    # Обычные ссылки
    websites: true

    # IP-адреса
    ip-addresses: true

  # Антиспам
  anti-spam:
    enabled: true

    # Запрещать одинаковые сообщения
    duplicate-messages: true

    # Игнорировать регистр и лишние пробелы
    normalize-messages: true

    # Задержка между сообщениями в секундах
    cooldown: 2

messages:

  prefix: "&6AlphaGrief &8» "

  link-blocked: "&cОтправка ссылок в чате запрещена!"

  spam-blocked: "&cНе отправляй одинаковые сообщения!"

  cooldown: "&cПодожди &f{seconds} сек. &cперед следующим сообщением."

  reload: "&aКонфигурация успешно перезагружена!"

  no-permission: "&cНедостаточно прав!"

  usage: "&7Используй: &f/acg reload"
