settings:
  auto-polls: true
  auto-interval-minutes: 60
  prefix: "&6AlphaGrief &8» &7"
  correct-commands: []
  wrong-commands: []
messages:
  announcement: "&6&lОПРОС &8» &f%question% &7— нажми &e/polls &7для голосования!"
  no-poll: "&7Сейчас активных опросов нет."
  already-voted: "&cТы уже проголосовал в этом опросе."
  vote-success: "&aТвой голос учтён!"
  admin-only: "&cНедостаточно прав."
  poll-ended: "&7Опрос завершён."
  poll-created: "&aОпрос создан!"
# Автоматические вопросы. Не повторяются, пока список не закончится.
presets:
  - question: "Какой режим добавить следующим?"
    options: ["Выживание", "Анархия", "Мини-игры"]
  - question: "Нужны ли новые кейсы?"
    options: ["Да", "Нет"]
  - question: "Как часто проводить ивенты?"
    options: ["Каждый день", "Раз в неделю", "Раз в месяц"]
  - question: "Какой бонус сделать на выходные?"
    options: ["Ключи", "Монеты", "Предметы"]
  - question: "Добавить новую карту?"
    options: ["Да", "Нет"]
  - question: "Какой формат ивента интереснее?"
    options: ["PvP", "Паркур", "Поиск предметов"]
  - question: "Нужны ли ежедневные задания?"
    options: ["Да", "Нет"]
  - question: "Какой вид наград предпочитаете?"
    options: ["Косметика", "Ресурсы", "Ключи"]
  - question: "Стоит ли расширить магазин?"
    options: ["Да", "Нет"]
  - question: "Какой день выбрать для большого ивента?"
    options: ["Пятница", "Суббота", "Воскресенье"]
