
name: AlphaChatGuard
version: 1.0.0
main: ru.alphagrief.alphachatguard.AlphaChatGuard
api-version: '1.21'
author: AlphaGrief
description: Anti-Advertisement and Anti-Spam

commands:
  acg:
    description: AlphaChatGuard management
    usage: /acg reload

permissions:
  alphachatguard.bypass:
    description: Bypass chat protection
    default: op
  alphachatguard.admin:
    description: Manage AlphaChatGuard
    default: op
