name: Build ChatPolls

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ChatPolls-Paper-1.21.11
          path: target/ChatPolls-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
